<nav class="navbar" aria-label="Navegação Principal">
    <div class="navbar-container">
        <div class="navbar-esquerda">

            <a class="navbar-logo" routerLink="/">Scent</a>

            <ul class="navbar-list">

                @for(item of itensMenu; track item.id) {
                <li class="navbar-item">
                    <a href="#" (click)="$event.preventDefault(); navegarPara(item.id)">
                        {{item.label}}
                    </a>
                </li>
                }
            </ul>
        </div>

        <div class="navbar-acoes">
            @if (sessao.usuario; as usuario) {
                @if (usuario.admin) {
                    <a routerLink="/admin/Crud">Administração</a>
                } @else {
                    <a routerLink="/">Olá, {{ usuario.nome }}</a>
                }
                <a href="#" (click)="$event.preventDefault(); sair()">Sair</a>
            } @else {
                <a routerLink="/pessoas/login">Minha Conta</a>
            }
            <a routerLink="/pessoas/carrinho">🛒Carrinho</a>
        </div>
    </div>
</nav>
